[project]
name = "segone-credit-risk-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "pandas==2.2.3",
    "numpy==2.2.3",
    "scikit-learn==1.6.1",
    "xgboost==2.1.4",
    "shap==0.47.0",
    "joblib==1.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
